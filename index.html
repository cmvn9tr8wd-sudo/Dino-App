    let audioCtx = null;

    // --- INICIALIZAR AUDIO AL HACER CLIC ---
    function inicializarAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // --- REPRODUCIR TAMBORES SELVÁTICOS ---
    function reproducirTamboresSelva() {
        inicializarAudioContext();
        let tiempos = [0, 0.25, 0.5, 0.75, 1.2, 1.45];
        let frecuencias = [110, 150, 90, 160, 100, 180];
        let duraciones = [0.2, 0.15, 0.2, 0.15, 0.3, 0.2];

        tiempos.forEach((t, i) => {
            setTimeout(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let ahora = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frecuencias[i], ahora);
                osc.frequency.exponentialRampToValueAtTime(40, ahora + duraciones[i]);

                gain.gain.setValueAtTime(0.3, ahora);
                gain.gain.exponentialRampToValueAtTime(0.01, ahora + duraciones[i]);

                osc.start(ahora);
                osc.stop(ahora + duraciones[i]);
            }, t * 1000);
        });
    }

    // Reproducir tambores justo cuando carguen los elementos y el navegador lo permita
    window.addEventListener('DOMContentLoaded', () => {
        // Intentar reproducir (si el navegador lo bloquea, sonará perfecto al hacer clic en el botón)
        setTimeout(reproducirTamboresSelva, 500);
    });

    // --- RUGIDO DE T-REX ÉPICO AL ENTRAR ---
    function reproducirRugidoTRex(callback) {
        inicializarAudioContext();
        let ahora = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ahora);
        osc.frequency.linearRampToValueAtTime(70, ahora + 0.3);
        osc.frequency.linearRampToValueAtTime(110, ahora + 0.6);
        osc.frequency.linearRampToValueAtTime(50, ahora + 1.0);

        gain.gain.setValueAtTime(0.4, ahora);
        gain.gain.exponentialRampToValueAtTime(0.01, ahora + 1.1);

        osc.start(ahora);
        osc.stop(ahora + 1.1);

        setTimeout(() => {
            reproducirSonido('acierto');
            if(callback) callback();
        }, 900);
    }

    // --- FUNCIÓN PARA ENTRAR A LA APLICACIÓN ---
    function entrarAlApp() {
        const pantalla = document.getElementById('pantalla-bienvenida');
        reproducirRugidoTRex(() => {
            pantalla.style.opacity = '0';
            setTimeout(() => {
                pantalla.remove();
            }, 400);
        });
    }

    // --- EFECTOS DE SONIDO SINTETIZADOS ---
    function reproducirSonido(tipo) {
        inicializarAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let ahora = audioCtx.currentTime;

        if (tipo === 'voltear') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, ahora);
            osc.frequency.exponentialRampToValueAtTime(600, ahora + 0.1);
            gain.gain.setValueAtTime(0.15, ahora);
            gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.1);
            osc.start(ahora);
            osc.stop(ahora + 0.1);
        } else if (tipo === 'acierto') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, ahora);
            osc.frequency.setValueAtTime(600, ahora + 0.1);
            osc.frequency.setValueAtTime(800, ahora + 0.2);
            gain.gain.setValueAtTime(0.2, ahora);
            gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.35);
            osc.start(ahora);
            osc.stop(ahora + 0.35);
        } else if (tipo === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, ahora);
            osc.frequency.setValueAtTime(120, ahora + 0.15);
            gain.gain.setValueAtTime(0.15, ahora);
            gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.3);
            osc.start(ahora);
            osc.stop(ahora + 0.3);
        } else if (tipo === 'pintar') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(500, ahora);
            osc.frequency.exponentialRampToValueAtTime(200, ahora + 0.08);
            gain.gain.setValueAtTime(0.1, ahora);
            gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.08);
            osc.start(ahora);
            osc.stop(ahora + 0.08);
        }
    }

    // --- MÚSICA DE SELVA ---
    let musicaEncendida = false;
    function toggleMusicaSelva() {
        const audio = document.getElementById('audio-selva');
        const btn = document.getElementById('btn-musica');
        
        if (!musicaEncendida) {
            audio.play().then(() => {
                musicaEncendida = true;
                btn.innerHTML = "🎶 <span>Música de Selva: ENCENDIDA</span>";
                btn.className = "bg-green-400 hover:bg-green-300 text-emerald-950 text-xs font-bold px-3 py-1.5 rounded-full shadow transition flex items-center gap-1";
            }).catch(e => console.log("Bloqueado por navegador", e));
        } else {
            audio.pause();
            musicaEncendida = false;
            btn.innerHTML = "🎵 <span>Música de Selva: APAGADA</span>";
            btn.className = "bg-yellow-400 hover:bg-yellow-300 text-emerald-950 text-xs font-bold px-3 py-1.5 rounded-full shadow transition flex items-center gap-1";
        }
    }

    function cambiarSeccion(seccion) {
        ['videos', 'juegos', 'subir', 'apoyar'].forEach(s => {
            document.getElementById(`seccion-${s}`).classList.add('hidden');
            document.getElementById(`btn-${s}`).className = "bg-emerald-700 text-white font-bold px-5 py-2 rounded-full shadow-md transition";
        });

        document.getElementById(`seccion-${seccion}`).classList.remove('hidden');
        document.getElementById(`btn-${seccion}`).className = "bg-yellow-400 text-emerald-950 font-bold px-5 py-2 rounded-full shadow-md transition transform scale-105";
        
        if(seccion === 'videos') cargarVideos();
    }

    function abrirJuego(juego) {
        ['memorama', 'colorear', 'pista'].forEach(j => {
            document.getElementById(`juego-${j}`).classList.add('hidden');
            document.getElementById(`tab-${j}`).className = "bg-emerald-800 text-white font-bold px-3 py-2 rounded-xl shadow text-sm";
        });

        document.getElementById(`juego-${juego}`).classList.remove('hidden');
        document.getElementById(`tab-${juego}`).className = "bg-yellow-400 text-emerald-950 font-bold px-3 py-2 rounded-xl shadow text-sm";
    }

    // Memorama
    const dinos = ['🦖', '🦕', '🐉', '🐲'];
    let cartas = [...dinos, ...dinos];
    let primeraCarta = null;
    let segundaCarta = null;
    let bloqueo = false;
    let parejasEncontradas = 0;

    function reiniciarMemorama() {
        cartas.sort(() => Math.random() - 0.5);
        const tablero = document.getElementById('tablero-memorama');
        tablero.innerHTML = '';
        parejasEncontradas = 0;
        document.getElementById('mensaje-memorama').innerText = '';

        cartas.forEach((dino) => {
            const carta = document.createElement('div');
            carta.className = "card h-20 bg-emerald-900 rounded-xl cursor-pointer perspective-1000 border-2 border-emerald-600 flex items-center justify-center text-3xl shadow";
            carta.dataset.valor = dino;
            carta.innerHTML = `
                <div class="card-inner w-full h-full relative flex items-center justify-center">
                    <div class="card-front absolute inset-0 flex items-center justify-center bg-emerald-950 rounded-xl text-yellow-400 font-bold">❓</div>
                    <div class="card-back absolute inset-0 flex items-center justify-center bg-yellow-400 rounded-xl">${dino}</div>
                </div>
            `;
            carta.addEventListener('click', voltearCarta);
            tablero.appendChild(carta);
        });
    }

    function voltearCarta() {
        if (bloqueo) return;
        if (this === primeraCarta) return;

        reproducirSonido('voltear');
        this.classList.add('flipped');

        if (!primeraCarta) {
            primeraCarta = this;
            return;
        }

        segundaCarta = this;
        verificarPareja();
    }

    function verificarPareja() {
        let coincide = primeraCarta.dataset.valor === segundaCarta.dataset.valor;
        if (coincide) {
            reproducirSonido('acierto');
            primeraCarta.removeEventListener('click', voltearCarta);
            segundaCarta.removeEventListener('click', voltearCarta);
            resetearCartas();
            parejasEncontradas++;
            if (parejasEncontradas === dinos.length) {
                document.getElementById('mensaje-memorama').innerText = "🎉 ¡Ganaste! ¡Eres un experto en dinos!";
            }
        } else {
            bloqueo = true;
            setTimeout(() => {
                primeraCarta.classList.remove('flipped');
                segundaCarta.classList.remove('flipped');
                resetearCartas();
            }, 900);
        }
    }

    function resetearCartas() {
        [primeraCarta, segundaCarta, bloqueo] = [null, null, false];
    }

    // Colorear
    let colorActual = '#ef4444';
    function cambiarColor(color) {
        colorActual = color;
    }

    function pintarParte(idParte) {
        reproducirSonido('pintar');
        document.getElementById(idParte).setAttribute('fill', colorActual);
    }

    function reiniciarColores() {
        reproducirSonido('voltear');
        ['part-cuerpo', 'part-cabeza', 'part-cola', 'part-patat', 'part-patad'].forEach(id => {
            document.getElementById(id).setAttribute('fill', '#1e293b');

    // JUEGO 3: PISTA SELVÁTICA
    const pistas = [
        { pregunta: "🌿 Es el rey de los dinosaurios carnívoros, tiene brazos pequeños y dientes gigantes. ¿Quién es?", respuesta: "T-Rex", opciones: ["T-Rex", "Triceratops", "Brontosaurio", "Velociraptor"] },
        { pregunta: "🌿 Tiene un cuello larguísimo para alcanzar las hojas más altas de los árboles en la selva. ¿Quién es?", respuesta: "Cuellilargo", opciones: ["T-Rex", "Cuellilargo", "Spinosaurus", "Anquilosaurio"] },
        { pregunta: "🌿 Le encantan los ríos de la selva y tiene una gran vela en su espalda como un tiburón. ¿Quién es?", respuesta: "Spinosaurus", opciones: ["Velociraptor", "Spinosaurus", "Triceratops", "Pterodáctilo"] }
    ];
    let indicePista = 0;

    function cargarPista() {
        const p = pistas[indicePista];
        document.getElementById('pista-pregunta').innerText = p.pregunta;
        document.getElementById('mensaje-pista').innerText = '';
        const contenedorOpciones = document.getElementById('pista-opciones');
        contenedorOpciones.innerHTML = '';

        let opcionesMezcladas = [...p.opciones].sort(() => Math.random() - 0.5);

        opcionesMezcladas.forEach(op => {
            const btn = document.createElement('button');
            btn.className = "bg-emerald-900 hover:bg-emerald-950 text-white font-bold p-3 rounded-xl border border-emerald-600 shadow transition text-sm";
            btn.innerText = op;
            btn.onclick = () => verificarPista(op, p.respuesta);
            contenedorOpciones.appendChild(btn);
        });
    }

    function verificarPista(elegida, correcta) {
        const mensaje = document.getElementById('mensaje-pista');
        if (elegida === correcta) {
            reproducirSonido('acierto');
            mensaje.innerText = "🌟 ¡Correcto! ¡Muy bien explorador!";
            mensaje.className = "text-sm font-bold text-green-300 min-h-[24px]";
        } else {
            reproducirSonido('error');
            mensaje.innerText = "❌ ¡Inténtalo de nuevo!";
            mensaje.className = "text-sm font-bold text-yellow-300 min-h-[24px]";
        }
    }

    function siguientePista() {
        reproducirSonido('voltear');
        indicePista = (indicePista + 1) % pistas.length;
        cargarPista();
    }

    // Carga de Videos y Subida
    async function cargarVideos() {
        const contenedor = document.getElementById('lista-videos');
        try {
            const { data: videos, error } = await supabaseClient
                .from('videos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!videos || videos.length === 0) {
                contenedor.innerHTML = `<p class="text-emerald-300 col-span-2 text-center">No hay videos todavía. ¡Usa el botón "Subir Video" para agregar el primero!</p>`;
                return;
            }

            contenedor.innerHTML = '';
            videos.forEach(video => {
                let cleanId = video.youtube_id.split('?')[0].split('&')[0];
                if (cleanId.includes('/')) {
                    const parts = cleanId.split('/');
                    cleanId = parts[parts.length - 1];
                }

                const tarjeta = document.createElement('div');
                tarjeta.className = "bg-emerald-800 rounded-xl overflow-hidden shadow-lg border border-emerald-700 flex flex-col justify-between";
                tarjeta.innerHTML = `
                    <div>
                        <div class="relative pb-[56.25%] h-0">
                            <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${cleanId}" title="${video.title}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-yellow-300 text-lg">${video.title}</h3>
                            <span class="inline-block bg-emerald-900 text-emerald-200 text-xs px-2 py-1 rounded mt-2">${video.category || 'Dinosaurios'}</span>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="eliminarVideo(${video.id})" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-xs py-2 rounded-lg transition shadow">
                            🗑️ Eliminar este video
                        </button>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });

        } catch (err) {
            console.error('Error cargando videos:', err);
            contenedor.innerHTML = `<p class="text-yellow-300 col-span-2 text-center">Hubo un error cargando los videos.</p>`;
        }
    }

    async function eliminarVideo(id) {
        if (!confirm("¿Estás seguro de que quieres eliminar este video?")) return;

        const { error } = await supabaseClient
            .from('videos')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Hubo un error al eliminar el video.");
        } else {
            cargarVideos(); 
        }
    }

    async function subirVideo(e) {
        e.preventDefault();
        let rawYtId = document.getElementById('input-ytid').value.trim();
        
        if (rawYtId.includes('youtu.be/')) {
            rawYtId = rawYtId.split('youtu.be/')[1];
        } else if (rawYtId.includes('watch?v=')) {
            rawYtId = rawYtId.split('watch?v=')[1];
        } else if (rawYtId.includes('/shorts/')) {
            rawYtId = rawYtId.split('/shorts/')[1];
        }
        const ytid = rawYtId.split('?')[0].split('&')[0];

        const titulo = document.getElementById('input-titulo').value;
        const categoria = document.getElementById('input-cat').value || 'Dinosaurios';
        const estado = document.getElementById('mensaje-estado');

        estado.innerText = "Publicando...";
        estado.className = "text-center text-sm font-bold mt-2 text-yellow-300";

        const { error } = await supabaseClient
            .from('videos')
            .insert([{ title: titulo, youtube_id: ytid, category: categoria }]);

        if (error) {
            console.error(error);
            estado.innerText = "❌ Error al publicar.";
            estado.className = "text-center text-sm font-bold mt-2 text-red-400";
        } else {
            estado.innerText = "¡Video publicado con éxito! 🦖";
            estado.className = "text-center text-sm font-bold mt-2 text-green-300";
            document.getElementById('form-video').reset();
            cargarVideos(); 
            cambiarSeccion('videos');
        }
    }

    // Inicializar juegos al cargar
    reiniciarMemorama();
    cargarPista();
    cargarVideos();
</script>
